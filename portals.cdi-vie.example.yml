# Portal Scanner Configuration Template — CDI France & VIE ONLY
# Copy to portals.cdi-vie.yml and run via `make scan-cdi`.

max_posting_age_days: 45

title_filter:
  positive:
    - "platform engineer"
    - "site reliability"
    - "sre"
    - "devops"
    - "cloud infrastructure"
    - "kubernetes"
    - "distributed systems"
    - "vie"
  negative:
    - "java"
    - "jee"
    - "spring boot"
    - "thèse"
    - "cifre"
    - "phd"
    - "stage"
    - "intern"
    - "alternance"
    - "senior"
    - "staff"
    - "principal"
    - "manager"
    - "director"

location_filter:
  positive:
    - "paris"
    - "france"
    - "europe"
    - "switzerland"
    - "remote"
    - "hybrid"
  negative:
    - "us only"
    - "united states"
    - "usa"
    - "security clearance"

search_queries:
  - name: "CDI France — Platform / SRE / DevOps"
    query: 'site:welcometothejungle.com ("Platform Engineer" OR "SRE" OR "DevOps") ("Kubernetes" OR "Terraform") (Paris OR France) CDI -Java'

tracked_companies:
  - name: "Scaleway"
    careers_url: "https://careers.scaleway.com"
    api: "https://api.lever.co/v0/postings/scaleway"
    enabled: true
  - name: "Datadog"
    careers_url: "https://careers.datadoghq.com"
    api: "https://boards-api.greenhouse.io/v1/boards/datadog/jobs"
    enabled: true
